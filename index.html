<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La quieroo chinita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #240714; }
  body { background: radial-gradient(ellipse at 50% 45%, #5a1230 0%, #2f0a1c 45%, #170310 100%); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #msg {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-family: "Great Vibes", "Snell Roundhand", "Brush Script MT", cursive;
    color: #fff6ec; text-align: center; white-space: nowrap; line-height: 1.05;
    text-shadow: 0 0 16px rgba(255, 190, 120, .85), 0 0 40px rgba(255, 80, 130, .7);
    pointer-events: none;
  }
  #msg .l {
    display: inline-block; opacity: 0; transform: translateY(.25em) scale(.8); filter: blur(6px);
    transition: opacity .8s ease, transform .8s ease, filter .8s ease;
  }
  #msg .l.on { opacity: 1; transform: none; filter: none; }
  #msg .l.off { opacity: 0; transform: translateY(-.45em) scale(1.15); filter: blur(8px); transition-duration: 1.1s; }
  #mp {
    position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom));
    width: 54px; height: 54px; border-radius: 50%; padding: 0; cursor: pointer;
    display: grid; place-items: center; color: #f2c66a;
    background: rgba(255, 220, 170, .08); border: 1px solid rgba(242, 198, 106, .55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background .25s, transform .25s;
  }
  #mp:hover { background: rgba(255, 220, 170, .18); transform: scale(1.06); }
  #mp:focus-visible { outline: 2px solid #ffe3a3; outline-offset: 3px; }
  #mp:not(.playing):not(.missing) { animation: ring 2.4s ease-out infinite; }
  #mp.missing { opacity: .45; }
  @keyframes ring {
    0% { box-shadow: 0 0 0 0 rgba(242, 198, 106, .5); }
    80%, 100% { box-shadow: 0 0 0 16px rgba(242, 198, 106, 0); }
  }
  @media (prefers-reduced-motion: reduce) { #mp { animation: none !important; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<audio id="song" src="musica.mp3" loop preload="auto"></audio>
<button id="mp" type="button" aria-label="Reproducir música"></button>
<div id="msg">La quieroo<br>chinita</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const msg = document.getElementById('msg');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, dpr, parts = [], dust = [], bursts = [], unit, cx, cy, t0 = performance.now();

  const ease = t => { const c = 1.3; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  // Estrellas con brillo, dibujadas una sola vez por color
  function star(c, R, r, n = 5) {
    c.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const a = -Math.PI / 2 + i * Math.PI / n, rad = i % 2 ? r : R;
      c[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rad, Math.sin(a) * rad);
    }
    c.closePath();
  }
  function heartPath(c, r) {
    c.beginPath(); c.moveTo(0, r * .9);
    c.bezierCurveTo(-r * 1.6, -r * .1, -r * .9, -r * 1.4, 0, -r * .45);
    c.bezierCurveTo(r * .9, -r * 1.4, r * 1.6, -r * .1, 0, r * .9);
    c.closePath();
  }
  function sprite(color) {
    const s = 128, o = document.createElement('canvas'); o.width = o.height = s;
    const c = o.getContext('2d'); c.translate(s / 2, s / 2);
    const g = c.createRadialGradient(0, 0, 0, 0, 0, s / 2);
    g.addColorStop(0, color + '38'); g.addColorStop(.4, color + '14'); g.addColorStop(1, color + '00');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, s / 2, 0, 6.29); c.fill();
    c.fillStyle = color; heartPath(c, 27); c.fill();
    c.fillStyle = '#ffe3a3'; c.save(); c.translate(0, -2); heartPath(c, 14); c.fill(); c.restore();
    return o;
  }
  const sprites = [sprite('#e3b04f')];

  function heart(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x, y + r * .9);
    ctx.bezierCurveTo(x - r * 1.6, y - r * .1, x - r * .9, y - r * 1.4, x, y - r * .45);
    ctx.bezierCurveTo(x + r * .9, y - r * 1.4, x + r * 1.6, y - r * .1, x, y + r * .9);
    ctx.fill();
  }

  function fit() {
    msg.style.fontSize = '100px';
    const w = msg.offsetWidth || 330;
    msg.style.fontSize = (100 * unit * 12 / w) + 'px';
    msg.style.left = cx + 'px';
    msg.style.top = (cy + 0.2 * unit) + 'px';
  }

  function build() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    unit = Math.min(W / 34, H / 32) * 0.95;
    cx = W / 2; cy = H / 2 - 2.5 * unit;
    fit();

    const gap = Math.max(unit * 1.3, 12);
    const sMin = 0.5, ringStep = gap / (unit * 24);
    parts = [];
    let ring = 0;
    for (let s = 1; s >= sMin; s -= ringStep, ring++) {
      const n = Math.floor(95 * unit * s / gap);
      for (let i = 0; i < n; i++) {
        const ang = Math.random() * 6.28, dist = Math.max(W, H) * (0.6 + Math.random() * 0.5);
        parts.push({
          a0: (i + (ring % 2) * .5) / n * 6.2832, s,
          speed: 0.16 * (ring % 2 ? 1 : -1) * (0.8 + 0.4 * (1 - s)),
          sx: cx + Math.cos(ang) * dist, sy: cy + Math.sin(ang) * dist,
          r: gap * (0.5 + 0.1 * s) * (0.85 + Math.random() * 0.3),
          img: sprites[(Math.random() * sprites.length) | 0],
          spin: (Math.random() - .5) * 1.6, rot: Math.random() * 6.28,
          delay: (1 - s) * 1200 + Math.random() * 900,
          tw: Math.random() * 6.28, tws: 1.5 + Math.random() * 2.5
        });
      }
    }
    dust = Array.from({ length: Math.round(W / 30) }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: 3 + Math.random() * 8, v: 8 + Math.random() * 22, ph: Math.random() * 6.28, ts: 1 + Math.random() * 2.2
    }));
  }

  function put(img, x, y, size, rot, alpha) {
    ctx.globalAlpha = alpha;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.drawImage(img, -size / 2, -size / 2, size, size);
    ctx.restore();
  }

  function frame(now) {
    const T = now / 1000, t = still ? 99999 : now - t0;
    ctx.clearRect(0, 0, W, H);
    // corazoncitos rosados subiendo
    ctx.fillStyle = '#ff8fb0';
    for (const d of dust) {
      if (!still) d.y -= d.v / 60;
      if (d.y < -20) { d.y = H + 20; d.x = Math.random() * W; }
      const bl = 0.5 + 0.5 * Math.sin(T * d.ts + d.ph);   // parpadeo suave
      ctx.globalAlpha = 0.07 + 0.5 * bl * bl;
      heart(d.x + Math.sin(T / 1.5 + d.ph) * 12, d.y, d.r * (0.85 + 0.3 * bl));
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'lighter';

    const ph = (T % 1.25) / 1.25;
    const beat = t < 3800 ? 0 :
      Math.exp(-Math.pow((ph - .08) * 14, 2)) * .05 + Math.exp(-Math.pow((ph - .26) * 14, 2)) * .035;
    const k = unit * (1 + beat);

    for (const p of parts) {
      const q = Math.min(1, Math.max(0, (t - p.delay) / 1600)), e = ease(q);
      const a = p.a0 + (still ? 0 : p.speed * T);
      const hx = 16 * Math.pow(Math.sin(a), 3);
      const hy = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
      const x = p.sx + (cx + hx * p.s * k - p.sx) * e;
      const y = p.sy + (cy - hy * p.s * k - p.sy) * e;
      const tw = 0.5 + 0.5 * Math.sin(T * p.tws + p.tw);          // 0..1 destello
      const size = p.r * (2.6 + 1.6 * tw) * (1 + beat * 2);
      put(p.img, x, y, size, Math.sin(T * p.tws * .5 + p.tw) * .35, Math.min(1, q * 2) * (0.6 + 0.4 * tw));
    }

    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i]; b.x += b.vx; b.y += b.vy; b.vy += .05; b.life -= .014; b.rot += .08;
      if (b.life <= 0) { bursts.splice(i, 1); continue; }
      put(b.img, b.x, b.y, b.r * 4, b.rot, b.life);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  addEventListener('pointerdown', e => {
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * 6.28, v = 1 + Math.random() * 3.5;
      bursts.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5,
        r: 4 + Math.random() * 7, life: 1, rot: 0, img: sprites[(Math.random() * sprites.length) | 0] });
    }
  });
  addEventListener('resize', () => { build(); t0 = performance.now() - 4000; });

  // cada letra es independiente: aparecen una a una y se desvanecen en desorden
  msg.innerHTML = msg.innerHTML.split('<br>').map(line =>
    [...line].map(ch => `<span class="l">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('')).join('<br>');
  const letters = [...msg.querySelectorAll('.l')];
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function cycle() {
    if (still) { letters.forEach(l => l.classList.add('on')); return; }
    await wait(2600);
    while (true) {
      letters.forEach(l => l.classList.remove('off'));
      for (const l of letters) { l.classList.add('on'); await wait(120); }
      await wait(4000);
      const order = letters.map((_, i) => i).sort(() => Math.random() - .5);
      for (const i of order) { letters[i].classList.remove('on'); letters[i].classList.add('off'); await wait(100); }
      await wait(1500);
    }
  }

  build();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  // reproductor de música (archivo musica.mp3 junto a este index.html)
  const song = document.getElementById('song'), mp = document.getElementById('mp');
  const ICON = {
    play: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>',
    pause: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>'
  };
  mp.innerHTML = ICON.play;
  mp.addEventListener('pointerdown', e => e.stopPropagation());
  mp.addEventListener('click', () => { if (song.paused) song.play().catch(() => {}); else song.pause(); });
  song.addEventListener('play', () => { mp.innerHTML = ICON.pause; mp.classList.add('playing'); mp.setAttribute('aria-label', 'Pausar música'); });
  song.addEventListener('pause', () => { mp.innerHTML = ICON.play; mp.classList.remove('playing'); mp.setAttribute('aria-label', 'Reproducir música'); });
  song.addEventListener('error', () => { mp.classList.add('missing'); mp.title = 'Falta el archivo musica.mp3'; });

  cycle();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
